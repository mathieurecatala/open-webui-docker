# À chaque push : recherche de secrets, puis démarrage de la pile complète et tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tout l'historique est analysé
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose .

  pile:
    name: Pile Docker et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Modèles Ollama dans un dossier du projet, pour pouvoir les mettre en cache entre deux runs.
      OLLAMA_VOLUME: ./cache-ollama
      # Version d'Open WebUI de départ, avant la mise à jour testée (l'avant-dernière publiée).
      OPEN_WEBUI_VERSION_DEPART: v0.11.3
    steps:
      # Les images Open WebUI (6 Go) et Ollama (4 Go) dépassent l'espace libre du runner :
      # on supprime des outils préinstallés inutiles ici (.NET, Android, Haskell, CodeQL).
      - name: Libérer de l'espace disque
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dépendances des tests
        run: pip install -r requirements-tests.txt

      # On démarre volontairement sur l'avant-dernière version, puis on met à jour vers la version épinglée :
      # la mise à jour est ainsi testée entre deux vraies versions, avec des données en place.
      - name: Configuration de dev (version de départ)
        run: |
          cp .env.example .env
          sed -i "s/^OPEN_WEBUI_VERSION=.*/OPEN_WEBUI_VERSION=$OPEN_WEBUI_VERSION_DEPART/" .env

      - name: Cache du modèle Ollama
        uses: actions/cache@v6
        with:
          path: cache-ollama
          key: ollama-${{ hashFiles('.env.example') }}

      - name: Démarrage de la pile
        run: docker compose up -d --build --quiet-pull

      - name: Initialisation (administrateur, outil, modèle)
        run: ./scripts/initialiser.sh

      - name: Mise à jour vers la version épinglée (sauvegarde préalable)
        run: |
          cible=$(grep ^OPEN_WEBUI_VERSION= .env.example | cut -d= -f2)
          ./scripts/mettre-a-jour.sh "$cible"
          grep -qx "OPEN_WEBUI_VERSION=$cible" .env
          docker compose ps --format '{{.Service}} {{.Image}}' | grep -q "open-webui:$cible"
          # Place disque : l'ancienne image ne sert plus.
          docker image rm "ghcr.io/open-webui/open-webui:$OPEN_WEBUI_VERSION_DEPART" || true

      - name: Santé après mise à jour
        run: curl -fsSk https://localhost/health

      - name: Tests (sur la version épinglée, avec les données créées avant la mise à jour)
        run: pytest

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=200

      - name: Droits du cache (fichiers créés par root dans les conteneurs)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" cache-ollama || true
